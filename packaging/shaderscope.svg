<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2030"/>
      <stop offset="100%" stop-color="#0c0e16"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5fb3ff"/>
      <stop offset="100%" stop-color="#a64dff"/>
    </linearGradient>
    <pattern id="scan" patternUnits="userSpaceOnUse" width="6" height="6">
      <rect width="6" height="3" fill="#5fb3ff" opacity="0.18"/>
    </pattern>
  </defs>

  <!-- Rounded background plate -->
  <rect x="8" y="8" width="240" height="240" rx="44" ry="44" fill="url(#bg)"/>

  <!-- Scope ring (outer) -->
  <circle cx="128" cy="128" r="86" fill="none" stroke="url(#ring)" stroke-width="10"/>

  <!-- Crosshair ticks -->
  <g stroke="#5fb3ff" stroke-width="4" stroke-linecap="round">
    <line x1="128" y1="22"  x2="128" y2="36"/>
    <line x1="128" y1="220" x2="128" y2="234"/>
    <line x1="22"  y1="128" x2="36"  y2="128"/>
    <line x1="220" y1="128" x2="234" y2="128"/>
  </g>

  <!-- CRT-style scanline pattern inside the lens -->
  <circle cx="128" cy="128" r="76" fill="url(#scan)"/>

  <!-- Stylized "S" — Bezier ribbon, big and confident -->
  <path d="M 168 88
           Q 148 70 118 76
           Q 86 84 92 110
           Q 96 130 130 134
           Q 168 138 164 162
           Q 160 184 130 184
           Q 100 184 86 168"
        fill="none" stroke="url(#ring)" stroke-width="14"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
